<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield - Alice REPL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .output-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    
    .message.user {
      background: #667eea;
      color: white;
      margin-left: 40px;
      text-align: right;
    }
    
    .message.assistant {
      background: white;
      color: #333;
      margin-right: 40px;
      border: 1px solid #e0e0e0;
    }
    
    .message.error {
      background: #ffebee;
      color: #c62828;
      margin-right: 40px;
      border: 1px solid #ef5350;
    }
    
    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }
    
    .input-container {
      display: flex;
      gap: 10px;
    }
    
    #input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }
    
    #input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    #send-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    
    #send-btn:hover {
      opacity: 0.9;
    }
    
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Alice REPL</h1>
      <p>Lua Interpreter with Web Interface</p>
    </div>
    
    <div class="output-area" id="output"></div>
    
    <div class="input-area">
      <div class="input-container">
        <textarea id="input" placeholder="Type a command... (Shift+Enter for newline, Enter to send)" rows="1"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    
    function addMessage(text, type = 'assistant') {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.textContent = text;
      outputDiv.appendChild(msg);
      outputDiv.scrollTop = outputDiv.scrollHeight;
    }
    
    async function sendMessage() {
      const input = inputField.value.trim();
      if (!input) return;
      
      addMessage(input, 'user');
      inputField.value = '';
      inputField.style.height = 'auto';
      sendBtn.disabled = true;
      
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'loading';
      loadingMsg.textContent = 'Processing...';
      outputDiv.appendChild(loadingMsg);
      outputDiv.scrollTop = outputDiv.scrollHeight;
      
      try {
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: input})
        });
        
        outputDiv.removeChild(loadingMsg);
        
        if (!response.ok) {
          addMessage(`Error: ${response.status}`, 'error');
          sendBtn.disabled = false;
          return;
        }
        
        const data = await response.json();
        addMessage(data.response || 'No response', 'assistant');
      } catch (err) {
        outputDiv.removeChild(loadingMsg);
        addMessage(`Network error: ${err.message}`, 'error');
      }
      
      sendBtn.disabled = false;
      inputField.focus();
    }
    
    sendBtn.onclick = sendMessage;
    
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    inputField.addEventListener('input', () => {
      inputField.style.height = 'auto';
      inputField.style.height = Math.min(inputField.scrollHeight, 100) + 'px';
    });
    
    inputField.focus();
    addMessage('Shield ready. Type a command to begin.', 'assistant');
  </script>
</body>
</html>
