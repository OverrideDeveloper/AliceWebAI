<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice - Gemma4:26b</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #101010;
      --panel: #181818;
      --panel-light: #202020;
      --border: #303030;
      --text: #d4d4d4;
      --muted: #8f8f8f;
      --green: #7fa87f;
      --green-dark: #294129;
      --user: #1e2b1e;
      --error: #3a2020;
      --error-text: #d89090;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #151515;
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }

    .header h1 {
      color: var(--green);
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      color: var(--muted);
      font-size: 12px;
    }

    .identity-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #131313;
      border-bottom: 1px solid var(--border);
    }

    .identity-title {
      color: #aaa;
      font-size: 13px;
      margin-right: 4px;
    }

    .identity-btn {
      padding: 7px 12px;
      background: #1c1c1c;
      color: #aaa;
      border: 1px solid #383838;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }

    .identity-btn:hover {
      background: #252525;
      color: var(--text);
    }

    .identity-btn.active {
      background: var(--green-dark);
      color: #c9dac9;
      border-color: #527052;
    }

    .identity-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .identity-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .behavior-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      padding: 12px 20px;
      background: #131313;
      border-bottom: 1px solid var(--border);
    }

    .behavior-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .behavior-label input {
      width: 15px;
      height: 15px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .output-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #111;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background: var(--user);
      color: #d8e4d8;
      border: 1px solid #304630;
    }

    .message.assistant {
      background: #181818;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .message.error {
      background: var(--error);
      color: var(--error-text);
      border: 1px solid #5a3030;
    }

    .input-area {
      padding: 16px 20px;
      background: #151515;
      border-top: 1px solid var(--border);
    }

    .input-container {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      min-height: 44px;
      padding: 12px;
      background: #0f0f0f;
      color: var(--text);
      border: 1px solid #383838;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
    }

    #input:focus {
      outline: none;
      border-color: #587558;
      box-shadow: 0 0 0 2px rgba(127, 168, 127, 0.08);
    }

    #input::placeholder {
      color: #666;
    }

    #send-btn {
      min-height: 44px;
      padding: 12px 22px;
      background: #293b29;
      color: #c9dac9;
      border: 1px solid #405840;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #send-btn:hover {
      background: #334933;
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      color: #777;
      font-style: italic;
      padding: 8px 4px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .container {
        height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .identity-controls {
        gap: 8px;
      }

      .identity-status {
        width: 100%;
        margin-left: 0;
      }

      .behavior-controls {
        gap: 10px 14px;
      }

      .input-container {
        align-items: stretch;
      }

      #send-btn {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>

</head>

<body>
  <div class="container">


<div class="header">
  <h1>Alice - Gemma4:26b</h1>
  <p>Lua behavioral override middleware</p>
</div>

<div class="identity-controls">
  <span class="identity-title">Identity:</span>

  <button
    class="identity-btn"
    data-identity="mark"
    type="button"
  >
    Mark
  </button>

  <button
    class="identity-btn"
    data-identity="test"
    type="button"
  >
    Test User
  </button>

  <button
    class="identity-btn"
    data-identity="anonymous"
    type="button"
  >
    Anonymous
  </button>

  <span
    class="identity-status"
    id="identity-status"
  >
    Loading identity...
  </span>
</div>

<div class="behavior-controls">
  <label class="behavior-label">
    <input type="checkbox" id="behavior-gaslighting">
    <span>Gaslighting protection</span>
  </label>

  <label class="behavior-label">
    <input type="checkbox" id="behavior-hallucination">
    <span>Hallucination protection</span>
  </label>

  <label class="behavior-label">
    <input type="checkbox" id="behavior-overconfidence">
    <span>Overconfidence control</span>
  </label>

  <label class="behavior-label">
    <input type="checkbox" id="behavior-sycophancy">
    <span>Sycophancy control</span>
  </label>
</div>

<div class="output-area" id="output"></div>

<div class="input-area">
  <div class="input-container">
    <textarea
      id="input"
      placeholder="Chat away... (Shift+Enter for newline, Enter to send)"
      rows="1"
    ></textarea>

    <button id="send-btn" type="button">Send</button>
  </div>
</div>


  </div>

  <script>
    const outputDiv =
      document.getElementById("output");

    const inputField =
      document.getElementById("input");

    const sendBtn =
      document.getElementById("send-btn");

    const identityStatus =
      document.getElementById("identity-status");

    const identityButtons =
      document.querySelectorAll(".identity-btn");

    const behaviorControls = {
      gaslighting:
        document.getElementById(
          "behavior-gaslighting"
        ),

      hallucination:
        document.getElementById(
          "behavior-hallucination"
        ),

      overconfidence:
        document.getElementById(
          "behavior-overconfidence"
        ),

      sycophancy:
        document.getElementById(
          "behavior-sycophancy"
        )
    };


    function addMessage(
      text,
      type = "assistant"
    ) {
      const msg =
        document.createElement("div");

      msg.className =
        "message " + type;

      msg.textContent =
        String(text);

      outputDiv.appendChild(msg);

      outputDiv.scrollTop =
        outputDiv.scrollHeight;
    }


    function getBehaviorSettings() {
      return {
        gaslighting:
          behaviorControls.gaslighting.checked,

        hallucination:
          behaviorControls.hallucination.checked,

        overconfidence:
          behaviorControls.overconfidence.checked,

        sycophancy:
          behaviorControls.sycophancy.checked
      };
    }


    function setActiveIdentity(
      identityName
    ) {
      identityButtons.forEach(
        function(button) {
          button.classList.toggle(
            "active",
            button.dataset.identity ===
              identityName
          );
        }
      );
    }


    function getIdentityName(
      identity
    ) {
      identity =
        identity || {};

      const user =
        identity.user || {};

      const userId =
        String(user.id || "")
          .toLowerCase();

      if (
        identity.anonymous === true ||
        userId === "local-anonymous"
      ) {
        return "anonymous";
      }

      if (
        userId === "local-mark"
      ) {
        return "mark";
      }

      if (
        userId === "local-test-user"
      ) {
        return "test";
      }

      return null;
    }


    function displayIdentity(
      identity
    ) {
      identity =
        identity || {};

      const user =
        identity.user || {};

      const name =
        user.name || "Anonymous";

      identityStatus.textContent =
        "Signed in as " + name;

      const identityName =
        getIdentityName(identity);

      if (identityName) {
        setActiveIdentity(
          identityName
        );
      }
      else {
        identityButtons.forEach(
          function(button) {
            button.classList.remove(
              "active"
            );
          }
        );
      }
    }


    async function readJsonResponse(
      response
    ) {
      const text =
        await response.text();

      if (!text) {
        throw new Error(
          "Server returned an empty response"
        );
      }

      let data;

      try {
        data =
          JSON.parse(text);
      }
      catch (err) {
        throw new Error(
          "Server returned invalid JSON (" +
          response.status +
          "): " +
          text
        );
      }

      return data;
    }


    async function loadIdentity() {
      try {
        /*
         * This is the local simulated identity
         * endpoint. It reads the identity cookie
         * created by POST /api/identity.
         */
        const response =
          await fetch(
            "/api/identity",
            {
              method: "GET",
              cache: "no-cache",
              credentials: "same-origin"
            }
          );

        const data =
          await readJsonResponse(
            response
          );

        if (!response.ok) {
          throw new Error(
            data.error ||
            response.status
          );
        }

        displayIdentity(
          data.identity
        );

      }
      catch (err) {
        identityStatus.textContent =
          "Identity unavailable";

        console.error(
          "Unable to load identity:",
          err
        );

        addMessage(
          "Identity error: " +
          err.message,
          "error"
        );
      }
    }


    async function selectIdentity(
      identityName
    ) {
      identityButtons.forEach(
        function(button) {
          button.disabled = true;
        }
      );

      try {
        /*
         * This is NOT real authentication.
         *
         * local_identity.lua simply selects one
         * of the predefined local identities and
         * stores that selection in a cookie.
         */
        const response =
          await fetch(
            "/api/identity",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              credentials: "same-origin",
              body: JSON.stringify({
                identity:
                  identityName
              })
            }
          );

        const data =
          await readJsonResponse(
            response
          );

        if (!response.ok) {
          throw new Error(
            data.error ||
            response.status
          );
        }

        displayIdentity(
          data.identity
        );

        const selectedUser =
          (
            data.identity &&
            data.identity.user
          ) || {};

        addMessage(
          "Identity changed to " +
          (
            selectedUser.name ||
            "Anonymous"
          ) +
          ".",
          "assistant"
        );

      }
      catch (err) {
        addMessage(
          "Identity error: " +
          err.message,
          "error"
        );

      }
      finally {
        identityButtons.forEach(
          function(button) {
            button.disabled = false;
          }
        );

        inputField.focus();
      }
    }


    async function sendMessage() {
      const input =
        inputField.value.trim();

      if (
        !input ||
        sendBtn.disabled
      ) {
        return;
      }

      addMessage(
        input,
        "user"
      );

      inputField.value = "";

      inputField.style.height =
        "auto";

      sendBtn.disabled = true;

      const loadingMsg =
        document.createElement("div");

      loadingMsg.className =
        "loading";

      loadingMsg.textContent =
        "Processing...";

      outputDiv.appendChild(
        loadingMsg
      );

      outputDiv.scrollTop =
        outputDiv.scrollHeight;

      try {
        const response =
          await fetch(
            "/api/message",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              credentials: "same-origin",
              body: JSON.stringify({
                message: input,
                behaviors:
                  getBehaviorSettings()
              })
            }
          );

        if (
          loadingMsg.parentNode
        ) {
          loadingMsg.remove();
        }

        let data;

        try {
          data =
            await readJsonResponse(
              response
            );
        }
        catch (parseError) {
          addMessage(
            "Error: " +
            parseError.message,
            "error"
          );

          return;
        }

        if (!response.ok) {
          addMessage(
            "Error: " +
            (
              data.error ||
              response.status
            ),
            "error"
          );

          return;
        }

        addMessage(
          data.response ||
          "No response",
          "assistant"
        );

      }
      catch (err) {
        if (
          loadingMsg.parentNode
        ) {
          loadingMsg.remove();
        }

        addMessage(
          "Network error: " +
          err.message,
          "error"
        );

      }
      finally {
        sendBtn.disabled = false;
        inputField.focus();
      }
    }


    identityButtons.forEach(
      function(button) {
        button.addEventListener(
          "click",
          function() {
            selectIdentity(
              button.dataset.identity
            );
          }
        );
      }
    );


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    inputField.addEventListener(
      "keydown",
      function(e) {
        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {
          e.preventDefault();
          sendMessage();
        }
      }
    );


    inputField.addEventListener(
      "input",
      function() {
        inputField.style.height =
          "auto";

        inputField.style.height =
          Math.min(
            inputField.scrollHeight,
            120
          ) + "px";
      }
    );


    /*
     * Deliberately do NOT check any
     * behavior boxes here.
     *
     * Every checkbox starts unchecked
     * on a fresh page load.
     *
     * Pattern-based detection in
     * ConversationHandler remains
     * available independently.
     */

    inputField.focus();

    addMessage(
      "Alice started up. Please send your message.",
      "assistant"
    );

    loadIdentity();
  </script>

</body>
</html>
