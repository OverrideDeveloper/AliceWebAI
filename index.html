<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice - Local AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --terminal-black: #0a0c0a;
      --terminal-panel: #0f120f;

      --terminal-green: #86c98a;
      --terminal-green-dim: #5f8f63;
      --terminal-green-dark: #315a35;
      --terminal-green-faint: #182519;

      --terminal-error: #d47777;
      --terminal-error-dark: #5a3030;
    }

    body {
      font-family:
        "Courier New",
        Courier,
        monospace;

      background: var(--terminal-black);
      color: var(--terminal-green);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      height: 90vh;

      background: var(--terminal-black);

      border: 1px solid var(--terminal-green-dark);

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .header {
      background: var(--terminal-panel);
      color: var(--terminal-green);

      padding: 16px 20px;

      border-bottom: 1px solid var(--terminal-green-dark);

      text-align: left;
    }

    .header h1 {
      font-size: 20px;
      font-weight: normal;

      margin-bottom: 6px;
    }

    .header p {
      font-size: 12px;
      line-height: 1.5;

      color: var(--terminal-green-dim);
    }

    .output-area {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      background: var(--terminal-black);

      scrollbar-color:
        var(--terminal-green-dark)
        var(--terminal-black);

      scrollbar-width: thin;
    }

    .output-area::-webkit-scrollbar {
      width: 10px;
    }

    .output-area::-webkit-scrollbar-track {
      background: var(--terminal-black);
    }

    .output-area::-webkit-scrollbar-thumb {
      background: var(--terminal-green-dark);
    }

    .message {
      margin-bottom: 18px;

      padding: 12px 14px;

      border: 1px solid var(--terminal-green-dark);

      background: var(--terminal-panel);

      color: var(--terminal-green);

      line-height: 1.6;

      font-size: 15px;

      white-space: pre-wrap;

      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /*
     * User and assistant messages remain in the same vertical flow.
     * This keeps each exchange together rather than pushing the
     * user message to the opposite side of the interface.
     */

    .message.user {
      margin-left: 0;
      margin-right: 0;

      background: var(--terminal-green-faint);

      border-color: var(--terminal-green-dark);

      color: var(--terminal-green);

      text-align: left;
    }

    .message.user::before {
      content: "USER > ";

      font-weight: bold;

      color: var(--terminal-green-dim);
    }

    .message.assistant {
      margin-left: 0;
      margin-right: 0;

      background: var(--terminal-panel);

      border-color: var(--terminal-green-dark);

      color: var(--terminal-green);

      text-align: left;
    }

    .message.assistant::before {
      content: "ALICE > ";

      font-weight: bold;

      color: var(--terminal-green);
    }

    .message.error {
      margin-left: 0;
      margin-right: 0;

      background: #160d0d;

      border-color: var(--terminal-error-dark);

      color: var(--terminal-error);

      text-align: left;
    }

    .message.error::before {
      content: "ERROR > ";

      font-weight: bold;

      color: var(--terminal-error);
    }

    .input-area {
      padding: 16px 20px;

      background: var(--terminal-panel);

      border-top: 1px solid var(--terminal-green-dark);
    }

    .input-container {
      display: flex;

      gap: 10px;

      align-items: flex-end;
    }

    #input {
      flex: 1;

      min-height: 44px;
      max-height: 140px;

      padding: 11px 12px;

      border: 1px solid var(--terminal-green-dark);

      border-radius: 0;

      background: var(--terminal-black);

      color: var(--terminal-green);

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 15px;

      line-height: 1.4;

      resize: none;

      caret-color: var(--terminal-green);
    }

    #input::placeholder {
      color: var(--terminal-green-dim);

      opacity: 0.75;
    }

    #input:focus {
      outline: none;

      border-color: var(--terminal-green);

      background: #0c100c;
    }

    #send-btn {
      min-height: 44px;

      padding: 11px 20px;

      background: var(--terminal-panel);

      color: var(--terminal-green);

      border: 1px solid var(--terminal-green-dark);

      border-radius: 0;

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.15s,
        border-color 0.15s;
    }

    #send-btn:hover:not(:disabled) {
      background: var(--terminal-green-faint);

      border-color: var(--terminal-green);

      color: var(--terminal-green);
    }

    #send-btn:active:not(:disabled) {
      background: #1a291b;
    }

    #send-btn:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    .loading {
      padding: 10px 14px;

      margin-bottom: 18px;

      color: var(--terminal-green-dim);

      font-size: 14px;

      text-align: left;
    }

    .loading::before {
      content: "ALICE > ";

      color: var(--terminal-green);

      font-weight: bold;
    }

    /*
     * Very subtle scanlines.
     *
     * This is intentionally faint so the interface remains
     * comfortable to read for extended periods.
     */

    .container {
      position: relative;
    }

    .container::after {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(134, 201, 138, 0.008) 0px,
          rgba(134, 201, 138, 0.008) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .container {
        width: 100%;
        height: 100vh;

        border-left: none;
        border-right: none;
      }

      .header {
        padding: 14px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 11px;
      }

      .output-area {
        padding: 14px;
      }

      .input-area {
        padding: 12px;
      }

      .input-container {
        gap: 6px;
      }

      #send-btn {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>

</head>

<body>

  <div class="container">

<div class="header">
  <h1>Alice - Gemma4:26b</h1>

  <p>
    Local AI interface // Lua middleware // Ollama
  </p>
</div>

<div class="output-area" id="output"></div>

<div class="input-area">
  <div class="input-container">

    <textarea
      id="input"
      placeholder="Enter message... (Shift+Enter for newline, Enter to send)"
      rows="1"
    ></textarea>

    <button id="send-btn">SEND</button>

  </div>
</div>

  </div>

  <script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, type = 'assistant') {
      const msg = document.createElement('div');

      msg.className = `message ${type}`;

      msg.textContent = text;

      outputDiv.appendChild(msg);

      outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = inputField.value.trim();

      if (!input) {
        return;
      }

      addMessage(input, 'user');

      inputField.value = '';
      inputField.style.height = 'auto';

      sendBtn.disabled = true;

      const loadingMsg = document.createElement('div');

      loadingMsg.className = 'loading';
      loadingMsg.textContent = 'Processing...';

      outputDiv.appendChild(loadingMsg);

      outputDiv.scrollTop = outputDiv.scrollHeight;

      try {
        const response = await fetch('/api/message', {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            message: input
          })
        });

        if (loadingMsg.parentNode === outputDiv) {
          outputDiv.removeChild(loadingMsg);
        }

        if (!response.ok) {
          let errorText = `HTTP ${response.status}`;

          try {
            const errorData = await response.json();

            if (errorData.error) {
              errorText += `: ${errorData.error}`;
            }
          } catch (ignore) {
            // Keep the HTTP status if the server did not return JSON.
          }

          addMessage(errorText, 'error');

          sendBtn.disabled = false;
          inputField.focus();

          return;
        }

        const data = await response.json();

        if (data.error) {
          addMessage(data.error, 'error');
        } else {
          addMessage(
            data.response || 'No response received.',
            'assistant'
          );
        }

      } catch (err) {
        if (loadingMsg.parentNode === outputDiv) {
          outputDiv.removeChild(loadingMsg);
        }

        addMessage(
          `Network error: ${err.message}`,
          'error'
        );
      }

      sendBtn.disabled = false;
      inputField.focus();
    }

    sendBtn.addEventListener('click', sendMessage);

    inputField.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();

        sendMessage();
      }
    });

    inputField.addEventListener('input', function() {
      inputField.style.height = 'auto';

      inputField.style.height =
        Math.min(inputField.scrollHeight, 140) + 'px';
    });

    inputField.focus();

    addMessage(
      'Alice started up. Please send your message.',
      'assistant'
    );
  </script>

</body>
</html>
